<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framed page</title>
<style>
  :root { color-scheme: light dark; }
  /* Column flex, not positional grid rows. The adapters inject their own
     children into body — a skip-links block and a live-region announcer — and
     with `grid-template-rows: auto 1fr` the injected div took the first row and
     the header took the 1fr, which is how a 28px bar became 878px tall. */
  body { font: 13px/1.3 system-ui, sans-serif; margin: 0;
         display: flex; flex-direction: column; height: 100vh; }
  header { flex: 0 0 auto; display: flex; gap: .4rem; align-items: center;
           padding: .2rem .4rem; border-bottom: 1px solid #8884; }
  label { font-size: .78rem; opacity: .7; }
  input { flex: 1; min-width: 0; padding: .15rem .35rem; font: inherit; }
  #status { font: 11px ui-monospace, monospace; opacity: .6; white-space: nowrap; }
  iframe { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; }
</style>
</head>
<body>
<header>
  <label for="url">Page</label>
  <input id="url" type="url" value="https://en.wikipedia.org/wiki/Apple">
  <span id="status" role="status" aria-live="polite">loading…</span>
</header>
<iframe id="frame" title="Page under test"></iframe>

<script>
  // Every viewer follows the server, not its own address bar. The operator's
  // browser and the one on the hosted VM are separate documents rendering the
  // same page, so a navigation has to be state they both watch — otherwise
  // "open this page" moves one screen and not the other.
  const frame = document.getElementById('frame');
  const url = document.getElementById('url');
  const status = document.getElementById('status');
  // What the frame is actually showing, which is not the same as what the box
  // says: the box starts with a URL in it, so comparing against that skipped
  // the very first load and left an empty frame.
  let loadedUrl = null, wanted = {}, ready = false, seq = 0;

  function toFrame(method, ...args) {
    if (!ready) return;
    frame.contentWindow.postMessage(
      { kind: 'bh-iframe-req', id: 'h' + (++seq), method, args }, '*');
  }

  function show(state) {
    if (state.action) toFrame('performAction', state.action.id, state.action.target);
    wanted = state.settings || {};
    if (state.url !== loadedUrl) {
      loadedUrl = state.url;
      url.value = state.url;
      status.textContent = 'loading…';
      ready = false;
      frame.src = '/go?url=' + encodeURIComponent(state.url);
      return;                       // settings are applied once it says it is ready
    }
    if (Object.keys(wanted).length) toFrame('applySettings', wanted);
  }

  function request(body) {
    fetch('/state', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(body) })
      .catch(() => { status.textContent = 'could not reach the host'; });
  }

  new EventSource('/events').onmessage = (e) => show(JSON.parse(e.data));

  addEventListener('message', (ev) => {
    const m = ev.data;
    if (!m) return;
    // A link followed inside the frame becomes a navigation for every viewer,
    // and comes back through the proxy so the next page is adapted too.
    if (m.kind === 'bh-iframe-navigate') request({ url: m.url });
    if (m.kind === 'bh-iframe-ready') {
      ready = true;
      status.textContent = 'adapters ready';
      // The page has only just loaded, so whatever the session already asked
      // for has to be applied to it now — the state change that carried those
      // settings arrived before this document existed.
      if (Object.keys(wanted).length) toFrame('applySettings', wanted);
    }
  });

  url.addEventListener('keydown', (e) => { if (e.key === 'Enter') request({ url: e.target.value }); });
</script>
</body>
</html>
