<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Framed page</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0;
         display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header { display: flex; gap: .5rem; align-items: center;
           padding: .5rem .7rem; border-bottom: 1px solid #8884; }
  label { font-size: .85rem; }
  input { flex: 1; padding: .4rem .5rem; font: inherit; }
  #status { font: 12px ui-monospace, monospace; opacity: .7; white-space: nowrap; }
  iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<header>
  <label for="url">Page</label>
  <input id="url" type="url" value="https://en.wikipedia.org/wiki/Apple">
  <span id="status" role="status" aria-live="polite">loading…</span>
</header>
<iframe id="frame" title="Page under test"></iframe>

<script>
  // A way to check a page loads and its adapters came up, before a screen
  // reader is involved. The settings themselves are the chat's job — this
  // deliberately has no controls of its own.
  const frame = document.getElementById('frame');
  const url = document.getElementById('url');
  const status = document.getElementById('status');

  function load(u) {
    url.value = u;
    status.textContent = 'loading…';
    frame.src = '/go?url=' + encodeURIComponent(u);
  }

  addEventListener('message', (ev) => {
    const m = ev.data;
    if (!m) return;
    // Navigation inside the frame has to come back through the proxy, or the
    // next page arrives unadapted and framing headers apply to it again.
    if (m.kind === 'bh-iframe-navigate') load(m.url);
    if (m.kind === 'bh-iframe-ready') status.textContent = 'adapters ready';
  });

  url.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(e.target.value); });
  load(url.value);
</script>
</body>
</html>
